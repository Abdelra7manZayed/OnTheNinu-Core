<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - On The Ninu</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="brand justify-content-center mb-3">
            <div class="brand-mark">N</div>
            <div>
                <div class="brand-title">On The Ninu</div>
                <div class="brand-subtitle">Supermarket Management System</div>
            </div>
        </div>
        <h1 class="h4 text-center mb-4">Login</h1>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="/login" class="d-grid gap-3">
            <div>
                <label class="form-label">Username</label>
                <input class="form-control" type="text" name="username" required autofocus>
            </div>
            <div>
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
        <p class="text-muted small mt-4 mb-0 text-center">Local app only. Demo credentials are kept in README, not shown on the login page.</p>
    </div>
</body>
</html>
